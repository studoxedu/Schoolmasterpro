<body class="bg-gray-50 font-sans">
<div class="min-h-screen flex">
  <aside class="w-56 bg-gray-900 text-white flex flex-col fixed inset-y-0 z-30">
    <div class="p-4 border-b border-gray-700">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-green-600 rounded-lg flex items-center justify-center text-xs font-bold">S</div>
        <span class="font-semibold text-sm">SchoolMasterPro</span>
      </div>
      <p class="text-xs text-gray-400 mt-1" id="school-name-nav">Loading...</p>
    </div>
    <nav class="flex-1 p-3 space-y-1 text-sm overflow-y-auto">
      <a href="/"           class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-700 text-gray-300">📊 Dashboard</a>
      <a href="/students"        class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-700 text-gray-300">👥 Students</a>
      <a href="/reports"         class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-700 text-gray-300">📄 Reports</a>
      <a href="/term-comparison" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-700 text-gray-300">📈 Term Compare</a>
      <a href="/transcript"      class="flex items-center gap-2 px-3 py-2 rounded-lg bg-gray-700 text-white">📜 Transcript</a>
      <a href="/audit"           class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-700 text-gray-300">🔍 Audit Log</a>
    </nav>
    <div class="p-3 border-t border-gray-700">
      <button onclick="SMP.auth.signOut().then(()=>location.href='/login')" class="w-full text-left flex items-center gap-2 px-3 py-2 text-gray-400 hover:text-white text-sm">🚪 Sign Out</button>
    </div>
  </aside>

  <main class="ml-56 flex-1 p-6">
    <div class="max-w-4xl mx-auto">
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Academic Transcript</h1>
        <p class="text-gray-500 text-sm mt-1">Full term-by-term academic history for a student</p>
      </div>

      <!-- Student search -->
      <div class="bg-white rounded-xl border border-gray-200 p-5 mb-6">
        <label class="text-xs font-medium text-gray-700 uppercase tracking-wide">Find Student</label>
        <div class="flex gap-3 mt-2">
          <input type="text" id="student-search" placeholder="Type student name or SMP-ID…"
            class="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm"
            oninput="TranscriptPage.searchStudents(this.value)" />
        </div>
        <div id="student-suggestions" class="border border-gray-200 rounded-lg mt-1 hidden max-h-48 overflow-y-auto text-sm"></div>
      </div>

      <!-- Transcript content -->
      <div id="transcript-wrap" class="hidden">
        <!-- Header card -->
        <div class="bg-gray-900 rounded-xl p-6 mb-6 text-white">
          <div class="flex items-start justify-between">
            <div class="flex items-center gap-4">
              <div class="w-14 h-14 bg-green-600 rounded-xl flex items-center justify-center text-xl font-bold" id="t-avatar"></div>
              <div>
                <div class="text-xl font-bold" id="t-name"></div>
                <div class="text-gray-400 text-sm mt-1" id="t-meta"></div>
                <div class="mt-2">
                  <span class="bg-green-700 text-green-100 text-xs px-2 py-0.5 rounded-full font-mono" id="t-smpid"></span>
                </div>
              </div>
            </div>
            <button onclick="TranscriptPage.printPDF()" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white text-sm rounded-lg font-medium flex items-center gap-2">
              <span>⬇</span> Download PDF
            </button>
          </div>
        </div>

        <!-- Timeline -->
        <div id="timeline" class="space-y-6"></div>
      </div>

      <div id="empty-state" class="hidden text-center py-20 text-gray-400">
        <div class="text-5xl mb-4">📜</div>
        <div class="text-lg font-medium text-gray-600">No transcript data found</div>
        <div class="text-sm mt-1">This student has no recorded academic history</div>
      </div>
    </div>
  </main>
</div>

<script>
let currentTranscript = null;
let schoolData = null;

const TranscriptPage = {
  async init() {
    const session = await SMP.auth.getSession();
    if (!session) { window.location.href = '/login'; return; }
    schoolData = await SMP.school.get();
    if (schoolData) document.getElementById('school-name-nav').textContent = schoolData.name;

    // Support ?student= query param
    const params = new URLSearchParams(window.location.search);
    if (params.get('student')) {
      await this.loadTranscript(params.get('student'));
    }
  },

  async searchStudents(q) {
    if (q.length < 2) { document.getElementById('student-suggestions').classList.add('hidden'); return; }
    const { data } = await SMP.client.from('students')
      .select('id,first_name,last_name,student_code,smp_id,gender,date_of_birth')
      .eq('school_id', schoolData.id)
      .or(`first_name.ilike.%${q}%,last_name.ilike.%${q}%,smp_id.ilike.%${q}%,student_code.ilike.%${q}%`)
      .limit(8);
    const box = document.getElementById('student-suggestions');
    if (!data?.length) { box.classList.add('hidden'); return; }
    box.classList.remove('hidden');
    box.innerHTML = data.map(s => `
      <div class="px-3 py-2.5 hover:bg-gray-50 cursor-pointer border-b border-gray-100 last:border-0"
           onclick="TranscriptPage.loadTranscript('${s.id}')">
        <span class="font-medium text-gray-900">${s.first_name} ${s.last_name}</span>
        <span class="text-gray-400 text-xs ml-2">${s.student_code}</span>
        ${s.smp_id ? `<span class="ml-1 text-green-600 text-xs font-mono">${s.smp_id}</span>` : ''}
      </div>`).join('');
  },

  async loadTranscript(studentId) {
    document.getElementById('student-suggestions').classList.add('hidden');
    try {
      const { data, error } = await SMP.client.rpc('get_student_transcript', { p_student_id: studentId });
      if (error) throw error;
      currentTranscript = data;
      const timeline = data.timeline || [];
      if (!timeline.length) {
        document.getElementById('transcript-wrap').classList.add('hidden');
        document.getElementById('empty-state').classList.remove('hidden');
        return;
      }
      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('transcript-wrap').classList.remove('hidden');
      this.renderHeader(data.student);
      this.renderTimeline(timeline);
    } catch(e) { console.error(e); alert(e.message); }
  },

  renderHeader(s) {
    const initials = (s.name||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    document.getElementById('t-avatar').textContent = initials;
    document.getElementById('t-name').textContent = s.name;
    document.getElementById('t-meta').textContent =
      `${s.gender === 'M' ? 'Male' : 'Female'} · ${s.student_code}` +
      (s.dob ? ` · DOB: ${new Date(s.dob).toLocaleDateString('en-NG',{day:'2-digit',month:'short',year:'numeric'})}` : '');
    document.getElementById('t-smpid').textContent = s.smp_id || 'SMP-ID pending';
    document.getElementById('student-search').value = s.name;
  },

  renderTimeline(timeline) {
    const gradeColor = { A:'bg-green-100 text-green-800', B:'bg-blue-100 text-blue-800', C:'bg-yellow-100 text-yellow-800', D:'bg-orange-100 text-orange-800', E:'bg-red-100 text-red-700', F:'bg-red-200 text-red-900' };
    document.getElementById('timeline').innerHTML = timeline.map((term, i) => {
      const avgColor = term.average >= 70 ? 'text-green-700' : term.average >= 50 ? 'text-yellow-600' : 'text-red-600';
      const subjects = term.subjects || [];
      return `
      <div class="relative">
        <!-- Timeline connector -->
        ${i < timeline.length - 1 ? '<div class="absolute left-5 top-16 bottom-0 w-0.5 bg-gray-200 -mb-6"></div>' : ''}
        <div class="flex gap-4">
          <!-- Dot -->
          <div class="w-10 h-10 rounded-full bg-gray-900 flex items-center justify-center text-white text-xs font-bold flex-shrink-0 z-10">${i+1}</div>
          <!-- Card -->
          <div class="flex-1 bg-white rounded-xl border border-gray-200 overflow-hidden mb-2">
            <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
              <div>
                <div class="font-semibold text-gray-900">${term.term} <span class="text-gray-400 font-normal text-sm">· ${term.session}</span></div>
                <div class="text-xs text-gray-400 mt-0.5">${term.class} · ${subjects.length} subjects</div>
              </div>
              <div class="text-right">
                <div class="text-2xl font-bold ${avgColor}">${term.average}%</div>
                <div class="text-xs text-gray-400">average</div>
              </div>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-xs">
                <thead class="bg-gray-50">
                  <tr>
                    <th class="text-left px-4 py-2 text-gray-400 font-medium">Subject</th>
                    <th class="text-center px-3 py-2 text-gray-400 font-medium">CA1</th>
                    <th class="text-center px-3 py-2 text-gray-400 font-medium">CA2</th>
                    <th class="text-center px-3 py-2 text-gray-400 font-medium">Exam</th>
                    <th class="text-center px-3 py-2 text-gray-400 font-medium">Total</th>
                    <th class="text-center px-3 py-2 text-gray-400 font-medium">Grade</th>
                    <th class="text-left px-3 py-2 text-gray-400 font-medium">Remark</th>
                  </tr>
                </thead>
                <tbody>
                  ${subjects.map(sub => `
                  <tr class="border-b border-gray-50 hover:bg-gray-50">
                    <td class="px-4 py-2 font-medium text-gray-900">${sub.subject}</td>
                    <td class="px-3 py-2 text-center text-gray-600">${sub.ca1 ?? '—'}</td>
                    <td class="px-3 py-2 text-center text-gray-600">${sub.ca2 ?? '—'}</td>
                    <td class="px-3 py-2 text-center text-gray-600">${sub.exam ?? '—'}</td>
                    <td class="px-3 py-2 text-center font-bold text-gray-900">${sub.total ?? '—'}</td>
                    <td class="px-3 py-2 text-center">
                      <span class="px-1.5 py-0.5 rounded text-xs font-bold ${gradeColor[sub.grade]||'bg-gray-100 text-gray-700'}">${sub.grade||'—'}</span>
                    </td>
                    <td class="px-3 py-2 text-gray-500">${sub.remark||'—'}</td>
                  </tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
  },

  printPDF() {
    if (!currentTranscript) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const s = currentTranscript.student;
    const timeline = currentTranscript.timeline || [];
    const school = schoolData?.name || 'School';

    // Header
    doc.setFillColor(15,17,23); doc.rect(0,0,210,30,'F');
    doc.setTextColor(255,255,255); doc.setFontSize(16); doc.setFont('helvetica','bold');
    doc.text(school, 105, 13, {align:'center'});
    doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(180,180,180);
    doc.text('OFFICIAL ACADEMIC TRANSCRIPT', 105, 21, {align:'center'});
    doc.setFontSize(7); doc.text(`Generated: ${new Date().toLocaleDateString('en-NG')}`, 105, 27, {align:'center'});

    // Student info
    doc.setTextColor(0,0,0); doc.setFontSize(10); doc.setFont('helvetica','bold');
    doc.text(s.name, 14, 42);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(80,80,80);
    doc.text(`${s.student_code}  ·  ${s.smp_id||''}  ·  ${s.gender==='M'?'Male':'Female'}`, 14, 49);
    doc.setDrawColor(220,220,220); doc.line(14, 54, 196, 54);

    let y = 62;
    const gradeColors = { A:[26,107,60], B:[29,78,216], C:[133,104,0], D:[180,80,0], E:[192,57,43], F:[153,0,0] };

    timeline.forEach((term, ti) => {
      if (y > 250) { doc.addPage(); y = 20; }

      doc.setFillColor(245,245,245); doc.roundedRect(14, y-5, 182, 10, 2, 2, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(15,17,23);
      doc.text(`${term.term}  ·  ${term.session}  ·  ${term.class}`, 18, y+2);
      doc.setFont('helvetica','normal'); doc.setFontSize(8);
      const avgColor = term.average >= 70 ? [26,107,60] : term.average >= 50 ? [133,104,0] : [192,57,43];
      doc.setTextColor(...avgColor);
      doc.text(`Avg: ${term.average}%`, 185, y+2, {align:'right'});
      y += 12;

      // Subject rows
      doc.setTextColor(100,100,100); doc.setFontSize(7);
      doc.text('Subject', 18, y); doc.text('CA1', 100, y); doc.text('CA2', 118, y);
      doc.text('Exam', 136, y); doc.text('Total', 155, y); doc.text('Grade', 172, y);
      y += 4; doc.setDrawColor(230,230,230); doc.line(14, y, 196, y); y += 3;

      (term.subjects||[]).forEach(sub => {
        if (y > 272) { doc.addPage(); y = 20; }
        doc.setTextColor(30,30,30); doc.setFontSize(7.5); doc.setFont('helvetica','normal');
        doc.text(sub.subject.slice(0,28), 18, y);
        doc.text(String(sub.ca1??'—'), 100, y);
        doc.text(String(sub.ca2??'—'), 118, y);
        doc.text(String(sub.exam??'—'), 136, y);
        doc.setFont('helvetica','bold');
        doc.text(String(sub.total??'—'), 155, y);
        const gc = gradeColors[sub.grade] || [100,100,100];
        doc.setTextColor(...gc);
        doc.text(sub.grade||'—', 175, y);
        doc.setTextColor(30,30,30); doc.setFont('helvetica','normal');
        y += 6;
      });

      y += 5;
      if (ti < timeline.length - 1) {
        doc.setDrawColor(220,220,220); doc.line(14, y, 196, y); y += 6;
      }
    });

    // Footer
    doc.setFontSize(7); doc.setTextColor(150,150,150);
    doc.text(`This transcript is issued by ${school} via SchoolMasterPro. SMP-ID: ${s.smp_id||'N/A'}`, 105, 285, {align:'center'});

    doc.save(`transcript-${s.student_code}.pdf`);
  }
};

document.addEventListener('DOMContentLoaded', () => TranscriptPage.init());
</script>
  <script src="supabase.min.js"></script>
  <script src="smp-supabase.js"></script>
  <script src="smp-offline.js"></script>
</body>
</html>
