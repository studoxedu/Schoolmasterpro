<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Your School — SchoolMasterPro</title>
  <link rel="stylesheet" href="smp-styles.css" />
</head>
<body class="bg-white text-black min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md border border-black">
    <div class="border-b border-black px-6 py-4">
      <h1 class="text-lg font-semibold tracking-tight">SchoolMasterPro</h1>
      <p class="text-sm text-gray-600 mt-1">Register your school — free 30-day trial</p>
    </div>

    <div class="flex border-b border-black text-xs font-medium">
      <div id="step-indicator-1" class="flex-1 px-4 py-2 border-r border-black bg-black text-white">
        1. School Details
      </div>
      <div id="step-indicator-2" class="flex-1 px-4 py-2 text-gray-400">
        2. Admin Account
      </div>
    </div>

    <div id="error-banner" class="hidden mx-6 mt-4 border border-black bg-gray-50 px-3 py-2 text-sm"></div>

    <form id="register-form" class="px-6 py-6">

      <div id="step-1" class="space-y-4">
        <div>
          <label for="school_name" class="block text-sm font-medium mb-1">School Name *</label>
          <input type="text" id="school_name" name="school_name" required
            class="w-full border border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black"
            placeholder="e.g. Greenwood Academy" />
        </div>

        <div>
          <label for="school_address" class="block text-sm font-medium mb-1">Address</label>
          <input type="text" id="school_address" name="school_address"
            class="w-full border border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black"
            placeholder="Street address" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="school_state" class="block text-sm font-medium mb-1">State *</label>
            <input type="text" id="school_state" name="school_state" required
              class="w-full border border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black"
              placeholder="e.g. Gombe" />
          </div>
          <div>
            <label for="school_lga" class="block text-sm font-medium mb-1">LGA</label>
            <input type="text" id="school_lga" name="school_lga"
              class="w-full border border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black"
              placeholder="e.g. Gombe LGA" />
          </div>
        </div>

        <div>
          <label for="school_phone" class="block text-sm font-medium mb-1">School Phone</label>
          <input type="tel" id="school_phone" name="school_phone"
            class="w-full border border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black"
            placeholder="0803 000 0000" />
        </div>

        <button type="button" id="to-step-2"
          class="w-full bg-black text-white py-2.5 text-sm font-medium hover:bg-gray-800 transition">
          Continue
        </button>

        <p class="text-center text-sm text-gray-600">
          Already have an account?
          <a href="login.html" class="font-medium underline">Log in</a>
        </p>
      </div>

      <div id="step-2" class="hidden space-y-4">
        <div>
          <label for="admin_name" class="block text-sm font-medium mb-1">Your Full Name *</label>
          <input type="text" id="admin_name" name="admin_name" required
            class="w-full border border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black"
            placeholder="e.g. Nasir Ahmad" />
        </div>

        <div>
          <label for="admin_email" class="block text-sm font-medium mb-1">Email *</label>
          <input type="email" id="admin_email" name="admin_email" required
            class="w-full border border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black"
            placeholder="you@school.com" />
        </div>

        <div>
          <label for="admin_password" class="block text-sm font-medium mb-1">Password *</label>
          <input type="password" id="admin_password" name="admin_password" required minlength="6"
            class="w-full border border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black"
            placeholder="At least 6 characters" />
        </div>

        <div>
          <label for="admin_password_confirm" class="block text-sm font-medium mb-1">Confirm Password *</label>
          <input type="password" id="admin_password_confirm" name="admin_password_confirm" required minlength="6"
            class="w-full border border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black"
            placeholder="Re-enter password" />
        </div>

        <div class="flex gap-3">
          <button type="button" id="back-to-step-1"
            class="flex-1 border border-black py-2.5 text-sm font-medium hover:bg-gray-100 transition">
            Back
          </button>
          <button type="submit" id="submit-btn"
            class="flex-1 bg-black text-white py-2.5 text-sm font-medium hover:bg-gray-800 transition disabled:opacity-50">
            Create Account
          </button>
        </div>
      </div>

    </form>
  </div>

  <script src="supabase.min.js"></script>
  <script src="smp-supabase.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var step1 = document.getElementById("step-1");
      var step2 = document.getElementById("step-2");
      var ind1 = document.getElementById("step-indicator-1");
      var ind2 = document.getElementById("step-indicator-2");
      var errorBanner = document.getElementById("error-banner");
      var form = document.getElementById("register-form");
      var submitBtn = document.getElementById("submit-btn");

      function showError(message) {
        errorBanner.textContent = message;
        errorBanner.classList.remove("hidden");
      }

      function clearError() {
        errorBanner.textContent = "";
        errorBanner.classList.add("hidden");
      }

      document.getElementById("to-step-2").addEventListener("click", function () {
        clearError();
        var schoolName = document.getElementById("school_name").value.trim();
        var schoolState = document.getElementById("school_state").value.trim();

        if (!schoolName || !schoolState) {
          showError("Please fill in School Name and State before continuing.");
          return;
        }

        step1.classList.add("hidden");
        step2.classList.remove("hidden");
        ind1.classList.remove("bg-black", "text-white");
        ind1.classList.add("text-gray-400");
        ind2.classList.remove("text-gray-400");
        ind2.classList.add("bg-black", "text-white");
      });

      document.getElementById("back-to-step-1").addEventListener("click", function () {
        clearError();
        step2.classList.add("hidden");
        step1.classList.remove("hidden");
        ind2.classList.remove("bg-black", "text-white");
        ind2.classList.add("text-gray-400");
        ind1.classList.remove("text-gray-400");
        ind1.classList.add("bg-black", "text-white");
      });

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        clearError();

        var schoolName = document.getElementById("school_name").value.trim();
        var schoolAddress = document.getElementById("school_address").value.trim();
        var schoolState = document.getElementById("school_state").value.trim();
        var schoolLga = document.getElementById("school_lga").value.trim();
        var schoolPhone = document.getElementById("school_phone").value.trim();

        var adminName = document.getElementById("admin_name").value.trim();
        var adminEmail = document.getElementById("admin_email").value.trim();
        var password = document.getElementById("admin_password").value;
        var passwordConfirm = document.getElementById("admin_password_confirm").value;

        if (!adminName || !adminEmail || !password) {
          showError("Please fill in all required admin account fields.");
          return;
        }

        if (password !== passwordConfirm) {
          showError("Passwords do not match.");
          return;
        }

        if (password.length < 6) {
          showError("Password must be at least 6 characters.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating account...";

        try {
          var signUpResult = await SMP.signUp(adminEmail, password);
          if (signUpResult.error) {
            showError("Sign up failed: " + signUpResult.error.message);
            submitBtn.disabled = false;
            submitBtn.textContent = "Create Account";
            return;
          }

          var user = signUpResult.user;
          if (!user || !user.id) {
            showError("Sign up did not return a user. Please try again.");
            submitBtn.disabled = false;
            submitBtn.textContent = "Create Account";
            return;
          }

          submitBtn.textContent = "Setting up your school...";

          var provisionResult = await SMP.provisionSchool({
            p_name: schoolName,
            p_address: schoolAddress || null,
            p_state: schoolState || null,
            p_lga: schoolLga || null,
            p_phone: schoolPhone || null,
            p_school_type: "secondary",
            p_plan: "trial",
            p_admin_user_id: user.id,
            p_admin_email: adminEmail,
            p_admin_name: adminName,
          });

          if (provisionResult.error) {
            showError("School setup failed: " + provisionResult.error.message +
              ". Your login was created but your school was not set up — please contact support.");
            submitBtn.disabled = false;
            submitBtn.textContent = "Create Account";
            return;
          }

          if (signUpResult.session) {
            window.location.href = "index.html";
          } else {
            window.location.href = "login.html?registered=1";
          }
        } catch (err) {
          showError("Unexpected error: " + err.message);
          submitBtn.disabled = false;
          submitBtn.textContent = "Create Account";
        }
      });
    });
  </script>
</body>
</html>
