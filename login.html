<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — SchoolMasterPro</title>
  <link rel="stylesheet" href="smp-styles.css" />
</head>
<body class="bg-white text-black min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-sm border border-black">
    <div class="border-b border-black px-6 py-4">
      <h1 class="text-lg font-semibold tracking-tight">SchoolMasterPro</h1>
      <p class="text-sm text-gray-600 mt-1">Log in to your school dashboard</p>
    </div>

    <div id="info-banner" class="hidden mx-6 mt-4 border border-black bg-gray-50 px-3 py-2 text-sm"></div>
    <div id="error-banner" class="hidden mx-6 mt-4 border border-black bg-gray-50 px-3 py-2 text-sm"></div>

    <form id="login-form" class="px-6 py-6 space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium mb-1">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username"
          class="w-full border border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black"
          placeholder="you@school.com" />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium mb-1">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"
          class="w-full border border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black"
          placeholder="Your password" />
      </div>

      <button type="submit" id="submit-btn"
        class="w-full bg-black text-white py-2.5 text-sm font-medium hover:bg-gray-800 transition disabled:opacity-50">
        Log In
      </button>

      <p class="text-center text-sm text-gray-600">
        Don't have an account?
        <a href="register.html" class="font-medium underline">Register your school</a>
      </p>
    </form>
  </div>

  <script src="supabase.min.js"></script>
  <script src="smp-supabase.js"></script>
  <script>
    var submitBtn = document.getElementById("submit-btn");
    var errorBanner = document.getElementById("error-banner");
    var infoBanner = document.getElementById("info-banner");

    function showError(message) {
      errorBanner.textContent = message;
      errorBanner.classList.remove("hidden");
    }

    function clearError() {
      errorBanner.textContent = "";
      errorBanner.classList.add("hidden");
    }

    function showInfo(message) {
      infoBanner.textContent = message;
      infoBanner.classList.remove("hidden");
    }

    document.addEventListener("DOMContentLoaded", function () {
      var params = new URLSearchParams(window.location.search);
      if (params.get("registered") === "1") {
        showInfo("Account created. If email confirmation is enabled, check your inbox before logging in.");
      }

      document.getElementById("login-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        clearError();

        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;

        if (!email || !password) {
          showError("Please enter both email and password.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Logging in...";

        var result = await SMP.signIn(email, password);

        if (result.error) {
          showError("Login failed: " + result.error.message);
          submitBtn.disabled = false;
          submitBtn.textContent = "Log In";
          return;
        }

        if (!result.session) {
          showError("Login did not return a session. Please try again.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Log In";
          return;
        }

        window.location.href = "index.html";
      });
    });

    window.addEventListener("load", async function () {
      var session = await SMP.getSession();
      if (session) {
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
