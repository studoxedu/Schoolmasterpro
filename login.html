<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — SchoolMasterPro</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="smp-supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0f1117;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-logo {
      width: 48px; height: 48px;
      background: #1a6b3c;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }
    .brand-name {
      font-size: 20px;
      font-weight: 700;
      color: #0f1117;
      letter-spacing: -0.4px;
    }
    .brand-sub {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }
    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 14px;
      font-family: inherit;
      color: #0f1117;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #1a6b3c; }
    .error-box {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #dc2626;
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      padding: 13px;
      background: #1a6b3c;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:hover:not(:disabled) { background: #155c32; }
    .btn:disabled { opacity: 0.65; cursor: not-allowed; }
    .footer-links {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #64748b;
    }
    .footer-links a { color: #1a6b3c; font-weight: 600; text-decoration: none; }
    .footer-links a:hover { text-decoration: underline; }
    .admin-link {
      text-align: center;
      margin-top: 10px;
    }
    .admin-link a {
      font-size: 11px;
      color: #94a3b8;
      text-decoration: none;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path d="M12 3L4 7v5c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V7L12 3z" fill="white"/>
          <path d="M9 12l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-name">SchoolMasterPro</div>
      <div class="brand-sub">Sign in to your school account</div>
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="admin@yourschool.edu.ng" autocomplete="email" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <div class="error-box" id="error-box"></div>

    <button class="btn" id="login-btn" onclick="doLogin()">Sign In</button>

    <div class="footer-links">
      Don't have an account? <a href="register.html">Register your school</a>
    </div>
    <div class="admin-link">
      <a href="admin-login.html">Platform Admin →</a>
    </div>
  </div>

<script>
  // Enter key support
  document.getElementById('password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('email').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });

  async function doLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('login-btn');
    const errBox   = document.getElementById('error-box');

    errBox.style.display = 'none';

    if (!email || !password) {
      showError('Please enter your email and password.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> Signing in…';

    try {
      const { error } = await SMP.auth.signIn(email, password);
      if (error) { showError(error.message); return; }
      try { await SMP.usage.track('login'); } catch(e) {}
      window.location.href = 'index.html';
    } catch (e) {
      showError('Something went wrong. Please try again.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Sign In';
    }
  }

  function showError(msg) {
    const b = document.getElementById('error-box');
    b.textContent = msg;
    b.style.display = 'block';
    const btn = document.getElementById('login-btn');
    btn.disabled = false;
    btn.innerHTML = 'Sign In';
  }

  // Redirect if already logged in
  SMP.auth.getSession().then(function(s) {
    if (s) window.location.href = 'index.html';
  });
</script>
</body>
</html>
