<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0f1117"/>
  <link rel="manifest" href="/manifest.json"/>
  <title>Platform Admin Login — SchoolMasterPro</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#0f1117;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#1c1e26;border:1px solid #2a2d3a;border-radius:16px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,0.5)}
    .brand{text-align:center;margin-bottom:32px}
    .brand-logo{width:52px;height:52px;background:#1a6b3c;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
    .brand-name{font-size:18px;font-weight:700;color:#fff;letter-spacing:-0.3px}
    .brand-sub{font-size:12px;color:#6b7280;margin-top:4px;text-transform:uppercase;letter-spacing:0.08em}
    .admin-badge{display:inline-block;background:#7c3aed;color:#ede9fe;font-size:10px;font-weight:700;letter-spacing:0.1em;padding:3px 10px;border-radius:20px;text-transform:uppercase;margin-top:8px}
    .field{margin-bottom:16px}
    label{display:block;font-size:11px;font-weight:600;color:#9ca3af;margin-bottom:6px;letter-spacing:0.04em;text-transform:uppercase}
    input{width:100%;background:#12141c;border:1.5px solid #2a2d3a;border-radius:8px;padding:11px 14px;font-size:14px;font-family:inherit;color:#fff;outline:none;transition:border-color 0.15s}
    input:focus{border-color:#7c3aed}
    input::placeholder{color:#4b5563}
    .error-box{display:none;background:#1f0a0a;border:1px solid #7f1d1d;border-radius:8px;padding:10px 14px;font-size:13px;color:#fca5a5;margin-bottom:16px}
    .btn{width:100%;padding:13px;background:#7c3aed;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:background 0.15s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn:hover:not(:disabled){background:#6d28d9}
    .btn:disabled{opacity:0.65;cursor:not-allowed}
    .back-link{text-align:center;margin-top:20px;font-size:13px}
    .back-link a{color:#6b7280;text-decoration:none}
    .back-link a:hover{color:#9ca3af}
    .spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <path d="M12 3L4 7v5c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V7L12 3z" fill="white"/>
          <path d="M9 12l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-name">SchoolMasterPro</div>
      <div class="brand-sub">Platform Administration</div>
      <div class="admin-badge">Super Admin Access</div>
    </div>

    <div class="field">
      <label for="email">Admin Email</label>
      <input type="email" id="email" placeholder="admin@schoolmasterpro.com" autocomplete="email"/>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>

    <div class="error-box" id="error-box"></div>

    <button class="btn" id="login-btn" onclick="doAdminLogin()">Sign In as Platform Admin</button>

    <div class="back-link"><a href="/login">← Back to school login</a></div>
  </div>

  <script src="supabase.min.js"></script>
  <script src="smp-supabase.js"></script>
  <script src="smp-offline.js"></script>
  <script>
    document.getElementById('email').addEventListener('keydown', function(e){
      if(e.key==='Enter') document.getElementById('password').focus();
    });
    document.getElementById('password').addEventListener('keydown', function(e){
      if(e.key==='Enter') doAdminLogin();
    });

    function showError(msg) {
      const b = document.getElementById('error-box');
      b.textContent = msg;
      b.style.display = 'block';
      const btn = document.getElementById('login-btn');
      btn.disabled = false;
      btn.innerHTML = 'Sign In as Platform Admin';
    }

    async function doAdminLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('login-btn');
      const errBox   = document.getElementById('error-box');
      errBox.style.display = 'none';

      if (!email || !password) { showError('Please enter your email and password.'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Verifying…';

      try {
        // Step 1: authenticate
        const { error: authErr } = await SMP.auth.signIn(email, password);
        if (authErr) { showError(authErr.message); return; }

        // Step 2: confirm platform admin status
        btn.innerHTML = '<span class="spinner"></span> Checking access…';
        const { data: isAdmin, error: checkErr } = await SMP.client.rpc('is_platform_admin');
        if (checkErr) {
          await SMP.auth.signOut();
          showError('Could not verify admin status: ' + checkErr.message);
          return;
        }
        if (!isAdmin) {
          await SMP.auth.signOut();
          showError('This account does not have platform admin access. Use the school login instead.');
          return;
        }

        // Step 3: all good
        window.location.href = '/admin';
      } catch (e) {
        showError('Something went wrong. Please try again.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Sign In as Platform Admin';
      }
    }

    // Redirect if already logged in as admin
    window.addEventListener('load', async function() {
      const s = await SMP.auth.getSession();
      if (!s) return;
      try {
        const { data: isAdmin } = await SMP.client.rpc('is_platform_admin');
        if (isAdmin) window.location.href = '/admin';
      } catch (_) {}
    });
  </script>
</body>
</html>
